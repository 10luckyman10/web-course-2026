<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Simon</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Simon</h1>
    <p>Уровень: <span id="level">0</span></p>
    <p id="status">Нажмите «Старт», чтобы начать</p>

    <div class="board" id="board">
        <button class="sector green" data-index="0"></button>
        <button class="sector red" data-index="1"></button>
        <button class="sector yellow" data-index="2"></button>
        <button class="sector blue" data-index="3"></button>
    </div>

    <button id="start">Старт</button>

    <script src="script.js"></script>
</body>

</html>
