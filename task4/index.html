<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Быки и Коровы</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="game-container">
        <h1>Игра «Быки и коровы»</h1>

        <div class="controls">
            <input type="text" id="guessInput" placeholder="Введите 4 цифры" maxlength="4" autocomplete="off">
            <button id="checkBtn">Проверить</button>
            <button id="newGameBtn">Новая игра</button>
        </div>

        <div id="message" class="message"></div>

        <div class="stats">
            <p>Попыток: <span id="attemptsCount">0</span></p>
        </div>

        <h3>История попыток:</h3>
        <ul id="historyList"></ul>
    </div>

    <script src="script.js"></script>
</body>

</html>
