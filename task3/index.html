<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo-list</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="app">
        <h1>Список задач</h1>

        <form class="add-form" id="add-form">
            <input type="text" id="task-input" placeholder="Новая задача..." autocomplete="off">
            <button type="submit" id="add-btn">Добавить</button>
        </form>

        <p class="counter" id="counter">Осталось: 0, Выполнено: 0</p>

        <div class="filters" id="filters">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="active">Активные</button>
            <button class="filter-btn" data-filter="completed">Завершённые</button>
        </div>

        <ul class="task-list" id="task-list"></ul>
    </div>
</body>

</html>
